name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t flask-visit-counter .

      - name: Run container and check health
        run: |
          docker run -d -p 5000:5000 --name test-container flask-visit-counter
          sleep 5
          curl --fail http://localhost:5000/status || exit 1
          docker stop test-container